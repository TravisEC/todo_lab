{% extends "tasks/base.html" %}

{% block title %}{% if task %}Edit task{% else %}New task{% endif %}{% endblock %}

{% block content %}
<h1>{% if task %}Edit task{% else %}New task{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'task_list' %}">Cancel</a>
</form>
{% endblock %}
