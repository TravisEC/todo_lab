{% extends "tasks/base.html" %}

{% block title %}Tasks{% endblock %}

{% block content %}
<h1>Tasks</h1>

<ul>
    {% for task in tasks %}
        <li>
            <a href="{% url 'task_detail' task.pk %}">{{ task.title }}</a>
            {% if task.completed %}(Done){% else %}(Pending){% endif %}
        </li>
    {% empty %}
        <li>No tasks yet.</li>
    {% endfor %}
</ul>
{% endblock %}
